# 主机侧发布端口统一走 *_PUBLISH_PORT 环境变量覆盖，默认值与历史硬编码一致
# （不改默认行为）：
#   SERVIFY_PUBLISH_PORT=8080 / POSTGRES_PUBLISH_PORT=5432 / REDIS_PUBLISH_PORT=6379
#   WEKNORA_API_PUBLISH_PORT=9000 / WEKNORA_WEB_PUBLISH_PORT=9001（weknora overlay）
#   DIFY_PUBLISH_PORT=5001（dify overlay）
# 用法示例（本机 :6379 已被其它服务占用时）：
#   REDIS_PUBLISH_PORT=16379 docker-compose \
#     -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.weknora.yml up -d
# 容器间通信仍走服务名 + 容器内端口（如 redis:6379），不受这些变量影响。
services:
  servify:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      # 主机侧发布端口可覆盖（默认值即历史行为，不改死）：本机 :8080 被占用时
      # 用 SERVIFY_PUBLISH_PORT 换端口起栈，容器内端口不受影响。
      - "${SERVIFY_PUBLISH_PORT:-8080}:8080"
    environment:
      # 数据库配置
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=servify

      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # AI 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}

      # WeKnora 配置
      - WEKNORA_ENABLED=${WEKNORA_ENABLED:-false}
      - WEKNORA_BASE_URL=${WEKNORA_BASE_URL:-http://weknora:9000}
      - WEKNORA_API_KEY=${WEKNORA_API_KEY:-default-api-key}
      - WEKNORA_TENANT_ID=${WEKNORA_TENANT_ID:-default-tenant}
      - WEKNORA_KB_ID=${WEKNORA_KB_ID:-default-kb}

      # 降级配置
      - FALLBACK_ENABLED=${FALLBACK_ENABLED:-true}
      - CIRCUIT_BREAKER_ENABLED=${CIRCUIT_BREAKER_ENABLED:-true}

      # 其他配置
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${JWT_SECRET:-default-secret-key}
      - SERVIFY_JWT_SECRET=${JWT_SECRET:-default-secret-key}
      - SERVIFY_HOST=0.0.0.0
      - SERVIFY_PORT=8080

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 运行时镜像（Dockerfile 第三阶段 alpine:latest）只装了 ca-certificates，
      # 没有 curl——用 curl 的健康检查必然 exec 失败、把容器判成 unhealthy。
      # 改用 alpine 自带的 busybox wget（非 2xx 同样非零退出，语义与 curl -f 一致）。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - servify-network
    volumes:
      # 容器内路径必须落在运行时镜像 WORKDIR（/root/）下：服务把日志写到
      # ./logs/servify.log、附件写到 ./uploads，均相对进程 CWD 解析。挂到
      # /app 下时宿主目录永远收不到数据（容器重建即丢），且配置搜索路径
      # 虽含 /app，但镜像约定的挂载点同样是 WORKDIR 下的 ./config.yml。
      - ../../logs:/root/logs
      - ../../uploads:/root/uploads
      - ../../config.yml:/root/config.yml:ro
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: servify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # 启用 pgvector 扩展
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    networks:
      - servify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servify"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    ports:
      # 本机常见 redis（发行版 systemd 服务或他人容器）已占 :6379，
      # 用 REDIS_PUBLISH_PORT 覆盖即可与他人服务并存。
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    networks:
      - servify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:

networks:
  servify-network:
    driver: bridge
