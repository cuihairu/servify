<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NightPort — Web 嵌入示例（深色站）</title>
  <!--
    运行前提：Servify 已在本机 8080 端口运行（默认开发形态）。
      cd apps/server && go run ./cmd/server
    打开示例（由 Servify 直接提供示例页）：
      http://localhost:8080/demo-sdk/examples/page-dark.html
    本页演示：深色站嵌入——暗色主题整套 token、方形圆角悬浮按钮、
    救生圈预设图标、品牌位；面板/气泡/输入框与暗色宿主站不脱节。
  -->
  <style>
    /* 深色站：近黑底 + 冷灰面板 + 窄边框，模拟代理/节点管理面板 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #0b0f19; color: #e5e7eb; }
    header { background: #111827; border-bottom: 1px solid #1f2937; padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    header .logo { font-size: 18px; font-weight: 700; color: #93c5fd; letter-spacing: 1px; }
    header nav a { color: #9ca3af; text-decoration: none; margin-left: 28px; font-size: 14px; }
    header nav a:hover { color: #e5e7eb; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 48px 32px; }
    .wrap h1 { font-size: 26px; margin-bottom: 12px; }
    .wrap > p { color: #9ca3af; font-size: 14px; line-height: 1.9; margin-bottom: 32px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #111827; border: 1px solid #1f2937; border-radius: 10px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; font-size: 13px; border-bottom: 1px solid #1f2937; white-space: nowrap; }
    th { color: #9ca3af; font-weight: 500; background: #0d1320; }
    tr:last-child td { border-bottom: none; }
    .ok { color: #34d399; }
    .warn { color: #fbbf24; }
    /* 窄视口（≤480px）：组件此时自动切近全高 sheet，页面自身收紧留白 */
    @media (max-width: 480px) {
      header { padding: 0 16px; }
      header nav a { margin-left: 14px; font-size: 13px; }
      .wrap { padding: 32px 16px; }
      .wrap h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">NIGHTPORT</div>
    <nav><a href="#">节点</a><a href="#">订阅</a><a href="#">流量</a><a href="#">工单</a></nav>
  </header>
  <div class="wrap">
    <h1>我的节点</h1>
    <p>深色站点嵌入示例：widget 跟随暗色主题（theme: 'dark'），面板/气泡/输入框与宿主一致。右下角发起客服会话。</p>
    <div class="table-scroll">
      <table>
        <tr><th>节点</th><th>区域</th><th>负载</th><th>状态</th></tr>
        <tr><td>hk-01</td><td>香港</td><td>32%</td><td class="ok">在线</td></tr>
        <tr><td>jp-02</td><td>东京</td><td>58%</td><td class="ok">在线</td></tr>
        <tr><td>sg-03</td><td>新加坡</td><td>91%</td><td class="warn">拥塞</td></tr>
      </table>
    </div>
  </div>

  <!-- ═══ 嵌入 snippet（与 docs/embedding-guide.md §2 一致）═══ -->
  <!-- 组件资产由 Servify 服务端直接提供（/demo-sdk/*，非 production 环境） -->
  <script src="http://localhost:8080/demo-sdk/servify-sdk.umd.js"></script>
  <script src="http://localhost:8080/demo-sdk/widget.js"></script>
  <script>
    ServifyWidget.create({
      baseUrl: 'http://localhost:8080',
      color: '#3b82f6',          // 暗套下主色自动提亮一档，对比字色按亮度切换
      icon: 'lifebuoy',
      borderRadius: 14,          // 方形圆角按钮（区别于默认 50% 圆形）
      position: 'bottom-right',
      size: 'medium',
      theme: 'dark',
      brand: {
        name: 'NightPort 支持',
        welcome: 'NightPort 在线支持：节点、订阅、流量问题都可以直接问。'
      }
    });
  </script>
</body>
</html>
