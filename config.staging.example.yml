# Example staging-oriented baseline.
# Keep secrets injected from environment, but allow staging-specific origins and labels.

server:
  environment: "staging"

event_bus:
  # P3-3：staging 与 production 同等严格——"inmemory" 是不安全默认值，会被
  # 启动校验拒绝；staging 必须显式配置 "redis"（与 production 对齐）。
  provider: "redis"

# 数据库必须显式配置：缺失会回退代码默认 dev 密码并被启动校验拒绝。
database:
  host: "${DB_HOST}"
  port: 5432
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  name: "${DB_NAME}"
  max_open_conns: 50
  max_idle_conns: 10

voice:
  recording_provider: "disabled"
  transcript_provider: "disabled"
  pstn:
    provider: "disabled"
    validate_signature: true

webrtc:
  # TURN 时间限凭据（docs/TURN_DEPLOYMENT.md）：${ENV} 未注入时为空即禁用；
  # 启用需自建 coturn（use-auth-secret 模式）并注入以下环境变量。
  # STUN 沿用代码默认值；大陆部署必须改掉 Google 默认（见 docs/webrtc-deployment.md 第 6 节）。
  turn:
    url: "${WEBRTC_TURN_URL}"
    realm: "${WEBRTC_TURN_REALM}"
    static_auth_secret: "${WEBRTC_TURN_STATIC_AUTH_SECRET}"
    ttl: 5m

jwt:
  secret: "${SERVIFY_JWT_SECRET}"
  expires_in: "12h"

security:
  cors:
    enabled: true
    allowed_origins:
      - "https://staging-app.example.com"
      - "https://staging-ops.example.com"
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Authorization", "Content-Type", "X-Request-ID"]
  # P2-5 first slice: public-surface runtime baseline (mirrors production).
  headers:
    enabled: true
    hsts_enabled: false
    hsts_max_age_seconds: 31536000
    frame_options: "DENY"
    referrer_policy: "strict-origin-when-cross-origin"
    content_security_policy: "default-src 'self'; frame-ancestors 'none'"
  max_body_bytes: 16777216
  websocket_allowed_origins:
    - "https://staging-app.example.com"
    - "https://staging-ops.example.com"
  rbac:
    enabled: true
    roles:
      admin: ["*"]
      agent:
        - "tickets.read"
        - "tickets.write"
        - "customers.read"
        - "agents.read"
        - "knowledge.read"
        - "assist.read"
        - "gamification.read"
        - "voice.read"
        - "voice.write"
        - "custom_fields.read"
        - "session_transfer.read"
        - "session_transfer.write"
        - "satisfaction.read"
        - "satisfaction.write"
        - "workspace.read"
        - "macros.read"
        - "integrations.read"
  rate_limiting:
    enabled: true
    requests_per_minute: 180
    burst: 45
    key_header: ""
    whitelist_ips: []
    whitelist_keys: []
    paths:
      - enabled: true
        prefix: "/public/"
        requests_per_minute: 180
        burst: 45
      - enabled: true
        prefix: "/public/kb/"
        requests_per_minute: 90
        burst: 20
      - enabled: true
        prefix: "/public/csat/"
        requests_per_minute: 45
        burst: 10
      - enabled: true
        prefix: "/api/v1/auth/"
        requests_per_minute: 30
        burst: 15
      - enabled: true
        prefix: "/api/v1/ws"
        requests_per_minute: 60
        burst: 30
      - enabled: true
        prefix: "/uploads/"
        requests_per_minute: 120
        burst: 30
      - enabled: true
        prefix: "/api/v1/ai/query"
        requests_per_minute: 60
        burst: 20
      - enabled: true
        prefix: "/api/v1/ai/knowledge/"
        requests_per_minute: 15
        burst: 5
      - enabled: true
        prefix: "/api/v1/metrics/ingest"
        requests_per_minute: 240
        burst: 80
      - enabled: true
        prefix: "/api/"
        requests_per_minute: 120
        burst: 30
  audit:
    enabled: true
    retention: 2160h
    cleanup_interval: 24h
    cleanup_batch_size: 500
  session_risk:
    hot_refresh_window_minutes: 10
    recent_refresh_window_minutes: 30
    today_refresh_window_hours: 24
    rapid_change_window_hours: 12
    stale_activity_window_days: 14
    multi_public_ip_threshold: 3
    many_sessions_threshold: 4
    hot_refresh_family_threshold: 2
    medium_risk_score: 2
    high_risk_score: 5
    # P2-5 second slice: mirrors production (risky-source logins require
    # a second factor; needs session_ip_intelligence enabled).
    login_enforcement: "step_up"
    # P2-5 third slice: mirrors production (replayed refresh tokens revoke
    # the whole session family).
    refresh_reuse_policy: "revoke_family"
  session_risk_profiles:
    staging:
      hot_refresh_window_minutes: 10
      recent_refresh_window_minutes: 30
      rapid_change_window_hours: 12
      stale_activity_window_days: 14
      high_risk_score: 5
  session_ip_intelligence:
    enabled: false
    base_url: "https://geo-staging.example.com/lookup/{ip}"
    api_key: "${SESSION_IP_API_KEY}"
    auth_header: "Authorization"
    timeout_ms: 1500

ai:
  openai:
    api_key: "${OPENAI_API_KEY}"

dify:
  enabled: true
  base_url: "https://dify-staging.example.com/v1"
  api_key: "${DIFY_API_KEY}"
  dataset_id: "${DIFY_DATASET_ID}"

weknora:
  enabled: false
  api_key: "${WEKNORA_API_KEY}"

ragflow:
  enabled: false
  base_url: "http://localhost:9380"
  api_key: "${RAGFLOW_API_KEY}"
  dataset_id: "${RAGFLOW_DATASET_ID}"

log:
  level: "info"
  format: "json"
  output: "both"

monitoring:
  enabled: true
  health_checks:
    knowledge_provider: true
    weknora: true
