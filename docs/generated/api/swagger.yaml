info:
  contact: {}
paths:
  /api/agents:
    get:
      consumes:
      - application/json
      description: 获取客服列表（用于批量指派下拉/后台管理）
      parameters:
      - description: 返回条数（默认 200，最大 500）
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Agent'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取客服列表
      tags:
      - 客服管理
    post:
      consumes:
      - application/json
      description: 创建新的客服代理
      parameters:
      - description: 客服信息
        in: body
        name: agent
        required: true
        schema:
          $ref: '#/definitions/handlers.AgentCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Agent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 创建客服
      tags:
      - 客服管理
  /api/agents/{id}:
    get:
      consumes:
      - application/json
      description: 根据用户ID获取客服的详细信息
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Agent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取客服详情
      tags:
      - 客服管理
  /api/agents/{id}/assign-session:
    post:
      consumes:
      - application/json
      description: 将会话分配给指定的客服
      parameters:
      - description: 客服用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 分配信息
        in: body
        name: assignment
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 分配会话给客服
      tags:
      - 客服管理
  /api/agents/{id}/offline:
    post:
      consumes:
      - application/json
      description: 将客服状态设置为离线
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 客服下线
      tags:
      - 客服管理
  /api/agents/{id}/online:
    post:
      consumes:
      - application/json
      description: 将客服状态设置为在线
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 客服上线
      tags:
      - 客服管理
  /api/agents/{id}/release-session:
    post:
      consumes:
      - application/json
      description: 从客服释放指定的会话
      parameters:
      - description: 客服用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 释放信息
        in: body
        name: release
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 释放客服的会话
      tags:
      - 客服管理
  /api/agents/{id}/revoke-tokens:
    post:
      consumes:
      - application/json
      description: 提升 token_version 并刷新 token_valid_after，使该客服旧 token 失效
      parameters:
      - description: 客服用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 强制失效客服 token
      tags:
      - 客服管理
  /api/agents/{id}/status:
    put:
      consumes:
      - application/json
      description: 更新客服的在线状态
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 状态信息
        in: body
        name: status
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 更新客服状态
      tags:
      - 客服管理
  /api/agents/find-available:
    get:
      consumes:
      - application/json
      description: 根据技能和优先级查找可用的客服
      parameters:
      - collectionFormat: csv
        description: 所需技能
        in: query
        items:
          type: string
        name: skills
        type: array
      - description: 优先级
        in: query
        name: priority
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AgentInfo'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 查找可用客服
      tags:
      - 客服管理
  /api/agents/groups:
    get:
      description: 返回当前租户/工作区下全部坐席组（软删的不返回）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取坐席组列表
      tags:
      - 坐席组
    post:
      consumes:
      - application/json
      description: 创建坐席组并可同时设置成员；同名组在租户+工作区内唯一
      parameters:
      - description: 坐席组内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AgentGroup'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 创建坐席组
      tags:
      - 坐席组
  /api/agents/groups/{id}:
    delete:
      description: 软删坐席组；成员关系随之失效，排队中的目标组改为全局池兜底
      parameters:
      - description: 坐席组 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 删除坐席组
      tags:
      - 坐席组
    get:
      description: 按 ID 返回坐席组详情
      parameters:
      - description: 坐席组 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AgentGroup'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取单个坐席组
      tags:
      - 坐席组
    put:
      consumes:
      - application/json
      description: 部分更新坐席组（指针字段缺省不覆盖；enabled=false 可停用组）
      parameters:
      - description: 坐席组 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AgentGroup'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 更新坐席组
      tags:
      - 坐席组
  /api/agents/groups/{id}/members:
    get:
      description: 返回组内坐席用户 ID 列表
      parameters:
      - description: 坐席组 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取坐席组成员
      tags:
      - 坐席组
    put:
      consumes:
      - application/json
      description: 以请求体列表为准全量替换组成员（增量请先 GET 现有成员）
      parameters:
      - description: 坐席组 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 成员用户 ID 全量列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ReplaceGroupMembersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 全量替换坐席组成员
      tags:
      - 坐席组
  /api/agents/online:
    get:
      consumes:
      - application/json
      description: 获取当前在线的所有客服
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.AgentInfo'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取在线客服列表
      tags:
      - 客服管理
  /api/agents/stats:
    get:
      consumes:
      - application/json
      description: 获取客服相关的统计数据
      parameters:
      - description: 特定客服ID，用于获取单个客服的统计
        in: query
        name: agent_id
        type: integer
