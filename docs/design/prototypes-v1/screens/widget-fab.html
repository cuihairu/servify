<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 悬浮球三态</title>
<link rel="stylesheet" href="../assets/tokens.css">
<script>
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "dark") document.documentElement.dataset.theme = "dark";
  })();
</script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; background: var(--color-surface); }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 40px; }
  .stage-label { font-size: 13px; color: var(--color-text-2); }
  .states { display: flex; gap: 72px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cell .cap { font-size: 13px; font-weight: 600; color: var(--color-text); }
  .cell .sub { font-size: 12px; color: var(--color-text-2); }

  /* 悬浮球：56px，主色纯色，一层阴影（对应 --sw-trigger-size / --sw-shadow-trigger） */
  .fab {
    position: relative; width: 56px; height: 56px; border: 0; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--color-primary); color: var(--color-on-primary);
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    transition: transform 240ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 240ms ease;
  }
  .fab:hover { transform: translateY(-2px) scale(1.04); }
  .fab:active { transform: scale(0.94); }

  .badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 22px; height: 22px; padding: 0 6px;
    display: grid; place-items: center;
    border-radius: 999px; background: var(--color-danger); color: #fff;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    border: 2px solid var(--color-surface);
  }

  /* 展开过渡帧：面板自角落 scale+fade（240ms spring，Crisp 式入场） */
  .morph { position: relative; width: 200px; height: 130px; }
  .morph .mini {
    position: absolute; right: 0; bottom: 0;
    width: 170px; height: 118px;
    border-radius: 14px; background: var(--panel-bg);
    border: 1px solid var(--color-border); box-shadow: var(--panel-shadow);
    transform: scale(0.62) translateY(26px); transform-origin: 92% 96%;
    opacity: 0.55;
  }
  .morph .fab { position: absolute; right: 0; bottom: 0; opacity: 0.9; }
  .arrow-note { position: absolute; left: 0; top: 42%; font-size: 12px; color: var(--color-text-2); }
</style>
</head>
<body>
<div class="stage">
  <div class="stage-label">悬浮球 · 三态（右下角锚定，桌面 56px / 移动端 52px）</div>
  <div class="states">
    <div class="cell">
      <button class="fab" aria-label="打开客服聊天">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      </button>
      <span class="cap">收起</span>
      <span class="sub">对话气泡图标 · hover 上浮</span>
    </div>

    <div class="cell">
      <button class="fab" aria-label="打开客服聊天，3 条未读">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        <span class="badge">3</span>
      </button>
      <span class="cap">未读徽标</span>
      <span class="sub">离屏消息计数 · 纯色徽标</span>
    </div>

    <div class="cell">
      <div class="morph">
        <span class="arrow-note">240ms spring</span>
        <div class="mini"></div>
        <button class="fab" aria-label="收起聊天窗">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
        </button>
      </div>
      <span class="cap">展开过渡</span>
      <span class="sub">自右下角 scale(0.62→1) + fade，spring 回弹</span>
    </div>
  </div>
</div>
</body>
</html>
