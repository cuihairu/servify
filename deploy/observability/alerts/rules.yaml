groups:
  - name: servify.infrastructure
    rules:
      - alert: HighHTTP5xxRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate exceeds 5%"
          description: "Current 5xx rate is {{ $value | humanizePercentage }}."

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P99 HTTP latency exceeds 5 seconds"
          description: "Current P99 latency is {{ $value }}s."

      - alert: HighRateLimitDrops
        expr: sum(rate(ratelimit_dropped_total[5m])) > 10
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High rate of rate-limited requests"
          description: "Rate limit drops at {{ $value }}/s on path {{ $labels.path }}."

      - alert: HighGoroutineCount
        expr: go_goroutines > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Goroutine count exceeds 10000"
          description: "Current goroutine count is {{ $value }}."

  - name: servify.eventbus
    rules:
      - alert: EventBusHandlerFailures
        expr: sum(rate(eventbus_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event bus handler failures for {{ $labels.event_type }}"
          description: "Event handler failures at {{ $value }}/s."

      - alert: EventBusDeadLetters
        expr: sum(rate(eventbus_dead_letter_total[5m])) > 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Events being dead-lettered for {{ $labels.event_type }}"
          description: "Dead-lettered events at {{ $value }}/s."

  - name: servify.workers
    rules:
      - alert: WorkerJobFailures
        expr: sum(rate(worker_jobs_total{outcome="failure"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Worker {{ $labels.worker_name }} is failing"
          description: "Worker failure rate at {{ $value }}/s."

  - name: servify.ai
    rules:
      - alert: AIProviderDegraded
        expr: |
          sum(rate(ai_requests_total{outcome="failure"}[5m]))
          / sum(rate(ai_requests_total[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AI provider failure rate exceeds 20% for {{ $labels.provider }}"
          description: "AI provider {{ $labels.provider }} failure rate is {{ $value | humanizePercentage }}."

      - alert: AIHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(ai_request_duration_seconds_bucket[5m])) by (le, provider)) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI provider {{ $labels.provider }} P95 latency exceeds 10s"

      - alert: AIFallbackRatioHigh
        expr: |
          sum(rate(ai_requests_total{strategy="fallback"}[10m]))
          / sum(rate(ai_requests_total{strategy=~"primary|fallback"}[10m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI fallback ratio exceeds 50%"
          description: "Share of AI answers served by the degraded fallback path is {{ $value | humanizePercentage }}; transfers excluded."

  - name: servify.slo
    rules:
      - alert: SLOAvailabilityFastBurn
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[1h]))
            / sum(rate(http_requests_total[1h]))
          ) > (14.4 * 0.001)
          and
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m]))
          ) > (14.4 * 0.001)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Availability SLO fast burn (14.4x, ~2% of 30d budget in 1h)"
          description: "5xx ratio is {{ $value | humanizePercentage }} against a 99.9% availability SLO; page immediately."

      - alert: SLOAvailabilitySlowBurn
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[6h]))
            / sum(rate(http_requests_total[6h]))
          ) > (6 * 0.001)
          and
          (
            sum(rate(http_requests_total{status_code=~"5.."}[30m]))
            / sum(rate(http_requests_total[30m]))
          ) > (6 * 0.001)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Availability SLO slow burn (6x, ~5% of 30d budget in 6h)"
          description: "5xx ratio is {{ $value | humanizePercentage }} against a 99.9% availability SLO; investigate during business hours."

      - alert: SLOLatencyFastBurn
        expr: |
          (
            1 - sum(rate(http_request_duration_seconds_bucket{le="2"}[1h]))
            / sum(rate(http_request_duration_seconds_count[1h]))
          ) > (14.4 * 0.01)
          and
          (
            1 - sum(rate(http_request_duration_seconds_bucket{le="2"}[5m]))
            / sum(rate(http_request_duration_seconds_count[5m]))
          ) > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Latency SLO fast burn (14.4x, ~2% of 30d budget in 1h)"
          description: "Requests slower than 2s are {{ $value | humanizePercentage }} against a 99% latency SLO (<2s)."
