# Example production-oriented security baseline.
# Do not commit real secrets into this file.

server:
  environment: "production"

event_bus:
  # Redis Streams persists events for replay/troubleshooting. Delivery is
  # broadcast: every subscribing instance handles each event once — see
  # docs/multi-instance-boundary.md for the topology boundary (deploy
  # replicas: 1 unless the upgrade paths there are done).
  provider: "redis"

# 数据库必须显式配置：缺失会回退代码默认 dev 密码并被启动校验拒绝。
database:
  host: "${DB_HOST}"
  port: 5432
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  name: "${DB_NAME}"
  max_open_conns: 100
  max_idle_conns: 10

voice:
  # Production providers: twilio, deepgram
  recording_provider: "twilio"
  transcript_provider: "deepgram"
  twilio:
    account_sid: "${TWILIO_ACCOUNT_SID}"
    auth_token: "${TWILIO_AUTH_TOKEN}"
  # Hosted PSTN webhook ingress; the auth token is voice.twilio.auth_token.
  # Requires server.public_base_url to be set: Twilio signs the full URL.
  pstn:
    provider: "twilio"
    validate_signature: true
  deepgram:
    api_key: "${DEEPGRAM_API_KEY}"

jwt:
  secret: "${SERVIFY_JWT_SECRET}"
  expires_in: "12h"

security:
  cors:
    enabled: true
    allowed_origins:
      - "https://app.example.com"
      - "https://ops.example.com"
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Authorization", "Content-Type", "X-Request-ID"]
  # P2-5 first slice: public-surface runtime baseline.
  # With multiple allowlisted origins the server echoes the request's Origin
  # (plus Vary: Origin) instead of the illegal multi-valued ACAO header.
  headers:
    enabled: true
    hsts_enabled: false # TLS terminates at the reverse proxy; proxy injects HSTS
    hsts_max_age_seconds: 31536000
    frame_options: "DENY"
    referrer_policy: "strict-origin-when-cross-origin"
    content_security_policy: "default-src 'self'; frame-ancestors 'none'"
  max_body_bytes: 16777216 # 16MB global request-body cap
  websocket_allowed_origins:
    - "https://app.example.com"
    - "https://ops.example.com"
  rbac:
    enabled: true
    roles:
      admin: ["*"]
      agent:
        - "tickets.read"
        - "tickets.write"
        - "customers.read"
        - "agents.read"
        - "knowledge.read"
        - "assist.read"
        - "gamification.read"
        - "voice.read"
        - "voice.write"
        - "custom_fields.read"
        - "session_transfer.read"
        - "session_transfer.write"
        - "satisfaction.read"
        - "satisfaction.write"
        - "workspace.read"
        - "macros.read"
        - "integrations.read"
  rate_limiting:
    enabled: true
    requests_per_minute: 120
    burst: 30
    key_header: ""
    whitelist_ips: []
    whitelist_keys: []
    paths:
      - enabled: true
        prefix: "/public/"
        requests_per_minute: 120
        burst: 30
      - enabled: true
        prefix: "/public/kb/"
        requests_per_minute: 60
        burst: 15
      - enabled: true
        prefix: "/public/csat/"
        requests_per_minute: 30
        burst: 10
      - enabled: true
        prefix: "/api/v1/auth/"
        requests_per_minute: 20
        burst: 10
      - enabled: true
        prefix: "/api/v1/ws"
        requests_per_minute: 40
        burst: 20
      - enabled: true
        prefix: "/uploads/"
        requests_per_minute: 90
        burst: 20
      - enabled: true
        prefix: "/api/v1/ai/query"
        requests_per_minute: 45
        burst: 15
      - enabled: true
        prefix: "/api/v1/ai/knowledge/"
        requests_per_minute: 10
        burst: 5
      - enabled: true
        prefix: "/api/v1/metrics/ingest"
        requests_per_minute: 180
        burst: 60
      - enabled: true
        prefix: "/api/"
        requests_per_minute: 90
        burst: 20
  audit:
    enabled: true
    retention: 4320h
    cleanup_interval: 24h
    cleanup_batch_size: 500
  session_risk:
    # Production-oriented defaults: tighter windows, same score cutoffs.
    hot_refresh_window_minutes: 10
    recent_refresh_window_minutes: 30
    today_refresh_window_hours: 24
    rapid_change_window_hours: 12
    stale_activity_window_days: 14
    # Increase cautiously if users commonly share public egress.
    multi_public_ip_threshold: 2
    many_sessions_threshold: 3
    hot_refresh_family_threshold: 2
    medium_risk_score: 2
    high_risk_score: 4
    # P2-5 second slice: risky-source logins require a second factor.
    # Requires security.session_ip_intelligence to be enabled; built-in
    # heuristic labels (public/private/loopback/unknown) never trip it.
    login_enforcement: "step_up"
    # P2-5 third slice: a replayed (already-rotated) refresh token revokes the
    # whole session family, forcing re-login on every device in that family.
    refresh_reuse_policy: "revoke_family"
  session_risk_profiles:
    production:
      hot_refresh_window_minutes: 10
      recent_refresh_window_minutes: 30
      rapid_change_window_hours: 12
      stale_activity_window_days: 14
      high_risk_score: 4
  session_ip_intelligence:
    # Optional external Geo/IP enrichment provider.
    # Keep disabled until endpoint, auth and privacy review are ready.
    enabled: false
    base_url: "https://geo.example.com/lookup/{ip}"
    api_key: "${SESSION_IP_API_KEY}"
    auth_header: "Authorization"
    timeout_ms: 1500

ai:
  openai:
    api_key: "${OPENAI_API_KEY}"

dify:
  enabled: true
  base_url: "https://dify.example.com/v1"
  api_key: "${DIFY_API_KEY}"
  dataset_id: "${DIFY_DATASET_ID}"

weknora:
  enabled: false
  api_key: "${WEKNORA_API_KEY}"

ragflow:
  enabled: false
  base_url: "http://localhost:9380"
  api_key: "${RAGFLOW_API_KEY}"
  dataset_id: "${RAGFLOW_DATASET_ID}"

log:
  level: "info"
  format: "json"
  output: "both"

upload:
  # 多副本部署必须切 "s3"（本地磁盘存储在副本间不共享）；单机可用默认 "local"
  provider: "local"
  s3:
    region: "${S3_REGION}"
    bucket: "${S3_BUCKET}"
    endpoint: ""            # MinIO 等 S3 兼容端点；留空使用 AWS 默认
    access_key_id: "${S3_ACCESS_KEY_ID}"     # 与 secret_access_key 同时留空走 IAM role
    secret_access_key: "${S3_SECRET_ACCESS_KEY}"
    force_path_style: false
    presign_expiry_seconds: 3600
    public_base_url: ""     # 公共读 bucket/CDN 地址；留空则 /uploads/ 302 到 presigned URL

monitoring:
  enabled: true
  health_checks:
    knowledge_provider: true
    weknora: true
  metrics_path: "/metrics"
  tracing:
    enabled: true
    endpoint: "http://otel-collector:4317"
    insecure: true
    sample_ratio: 0.1
    service_name: "servify"
